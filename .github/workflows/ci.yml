name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - name: Verify packaged files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in plugins/*; do
            [ -d "$dir" ] || continue
            npm pack "./$dir" --pack-destination "$RUNNER_TEMP/packs" >/dev/null
          done
          for archive in "$RUNNER_TEMP/packs"/*.tgz; do
            for file in package.json index.js cordis.patch.yml icon.svg README.md LICENSE; do
              tar -tzf "$archive" | grep -q "package/$file$"
            done
            if tar -xOf "$archive" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s).dsh?.client?0:1))'; then
              tar -tzf "$archive" | grep -q 'package/client.js$'
            fi
          done

  install:
    name: Install in throwaway profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm install --global @deepseek-ai/dsh
      - name: Install from checkout
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          mkdir -p "$RUNNER_TEMP/workspace"
          cd "$RUNNER_TEMP/workspace"
          i=0
          for dir in "$GITHUB_WORKSPACE"/plugins/*; do
            i=$((i + 1))
            name=$(node -p "require('$dir/package.json').name")
            dsh plugin --profile "ci-$i" add "$dir"
            dsh --profile "ci-$i" --dump-config > "$RUNNER_TEMP/ci-$i.yml"
            grep -Fq "$name" "$RUNNER_TEMP/ci-$i.yml"
          done
      - name: Install from tarballs
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in "$GITHUB_WORKSPACE"/plugins/*; do
            npm pack "$dir" --pack-destination "$RUNNER_TEMP/packs" >/dev/null
          done
          cd "$RUNNER_TEMP/workspace"
          i=0
          for archive in "$RUNNER_TEMP"/packs/*.tgz; do
            i=$((i + 1))
            name=$(tar -xOf "$archive" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).name))')
            dsh plugin --profile "ci-tar-$i" add "$archive"
            dsh --profile "ci-tar-$i" --dump-config > "$RUNNER_TEMP/ci-tar-$i.yml"
            grep -Fq "$name" "$RUNNER_TEMP/ci-tar-$i.yml"
          done
